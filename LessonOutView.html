      .page-lesson-out .empty-state {

  <body class="halcyon-page halcyon-tools-section">
    <div class="halcyon-app">
      <div id="halcyonNavMount"></div>
      <script>
        window.HALCYON_NAV_MODE = 'tools';
        window.HALCYON_SECTION_PAGE = 'lessonout';
      </script>
      <script src="/static/signin/halcyon-nav.js?v=33"></script>
      <script src="/static/signin/halcyon-shell.js?v=9"></script>
      <main class="halcyon-main page-lesson-out">
        <div class="lo-content">
          <section class="header-panel">
            <div class="header-top">
              <div>
                <h1>Out of lesson</h1>
                <p class="meta" id="generated-meta">Loading the timetable…</p>
              </div>
              <button type="button" id="refresh-btn">Refresh from iSAMS</button>
            </div>
            <div class="choice-row">
              <div class="choice-label">Day</div>
              <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Day"></div>
            </div>
            <div class="choice-row">
              <div class="choice-label">Period</div>
              <div class="period-tabs" id="period-tabs" role="tablist" aria-label="Period"></div>
            </div>
            <div class="choice-row">
              <div class="choice-label">Lesson</div>
              <div class="lesson-line">
                <select id="lesson-select" class="lesson-select" aria-label="Lesson"></select>
                <input id="student-search" class="search-input" type="search" placeholder="Search" aria-label="Search" autocomplete="off" />
              </div>
            </div>
          </section>
          <p id="err" class="halcyon-status-msg" hidden></p>
          <section class="grid-panel">
            <p id="still-out" class="still-out" hidden></p>
            <div class="grid-scroll">
              <table class="out-grid">
                <thead>
                  <tr>
                    <th class="student-name" scope="col">Student</th>
                    <th scope="col">Reasons</th>
                    <th scope="col">Left</th>
                    <th scope="col">Back</th>
                  </tr>
                </thead>
                <tbody id="grid-body"></tbody>
              </table>
            </div>
            <p id="empty-state" class="empty-state">Choose a lesson to see the class.</p>
          </section>
        </div>
      </main>
    </div>
    <script>
      (function () {
        var REASONS = ["Toilet", "Water", "Movement break", "Wellbeing", "No reason", "Other"];
        var STORE = "halcyon-lesson-out-v1";
        var data = null;
        var dayOrder = 1;
        var periodOrder = 1;
        var students = [];
        var classToken = 0;
        var pollTimer = null;

        function el(id) {
          return document.getElementById(id);
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function nowTime() {
          var d = new Date();
          var h = String(d.getHours()).padStart(2, "0");
          var m = String(d.getMinutes()).padStart(2, "0");
          return h + ":" + m;
        }

        function isoDate(d) {
          var month = String(d.getMonth() + 1).padStart(2, "0");
          var day = String(d.getDate()).padStart(2, "0");
          return d.getFullYear() + "-" + month + "-" + day;
        }

        function selectedDate() {
          var now = new Date();
          var sinceMonday = (now.getDay() + 6) % 7;
          var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - sinceMonday);
          monday.setDate(monday.getDate() + (dayOrder - 1));
          return isoDate(monday);
        }

        function logKey() {
          var lesson = selectedLesson();
          if (!lesson) return "";
          return selectedDate() + "|" + lesson.id;
        }

        function readStore() {
          try {
            return JSON.parse(localStorage.getItem(STORE) || "{}") || {};
          } catch (e) {
            return {};
          }
        }

        function writeStore(store) {
          localStorage.setItem(STORE, JSON.stringify(store));
        }

        function lessonLog() {
          var key = logKey();
          var store = readStore();
          return (key && store[key]) || {};
        }

        function blankTrip() {
          return { reasons: [], other: "", left: "", back: "" };
        }

        function tripReasons(trip) {
          if (!trip) return [];
          var reasons = Array.isArray(trip.reasons)
            ? trip.reasons.filter(Boolean)
            : (trip.reason ? [trip.reason] : []);
          return reasons.map(function (reason) {
            return reason === "Learning/Movement break" || reason === "Movement break only"
              ? "Movement break"
              : reason;
          });
        }

        function tripIsEmpty(trip) {
          return !tripReasons(trip).length && !(trip && trip.other) && !(trip && trip.left) && !(trip && trip.back);
        }

        function normalizeEntry(entry) {
          var trips = [];
          if (entry && Array.isArray(entry.trips)) {
            entry.trips.forEach(function (trip) {
              var next = {
                reasons: tripReasons(trip),
                other: (trip && trip.other) || "",
                left: (trip && trip.left) || "",
                back: (trip && trip.back) || ""
              };
              if (!tripIsEmpty(next)) trips.push(next);
            });
          } else if (entry && (entry.reason || entry.other || entry.left || entry.back)) {
            trips.push({
              reasons: entry.reason ? [entry.reason] : [],
              other: entry.other || "",
              left: entry.left || "",
              back: entry.back || ""
            });
          }
          return { trips: trips };
        }

        function saveStudent(studentId, entry) {
          var key = logKey();
          if (!key) return;
          var store = readStore();
          var log = store[key] || {};
          var cleaned = normalizeEntry(entry);
          if (!cleaned.trips.length) delete log[studentId];
          else log[studentId] = cleaned;
          if (Object.keys(log).length) store[key] = log;
          else delete store[key];
          writeStore(store);
        }

        function entryFor(studentId) {
          return normalizeEntry(lessonLog()[studentId]);
        }

        function ensureTrip(entry, index) {
          while (entry.trips.length <= index) entry.trips.push(blankTrip());
          return entry.trips[index];
        }

        function studentStillOut(entry) {
          return (entry.trips || []).some(function (trip) {
            return trip.left && !trip.back;
          });
        }

        function setErr(msg) {
          var node = el("err");
          node.hidden = !msg;
          node.textContent = msg || "";
        }

        function selectedLesson() {
          var id = el("lesson-select").value;
          return (lessonsForSlot() || []).filter(function (lesson) {
            return lesson.id === id;
          })[0] || null;
        }

        function lessonsForSlot() {
          if (!data) return [];
          var slot = dayOrder + "-" + periodOrder;
          return (data.lessons || []).filter(function (lesson) {
            return lesson.slot === slot;
          });
        }

        function lessonLabel(lesson) {
          var parts = [lesson.subject];
          if (lesson.code && lesson.code !== lesson.subject) parts.push(lesson.code);
          if (lesson.room) parts.push(lesson.room);
          if (lesson.teachers && lesson.teachers.length) parts.push(lesson.teachers.join(", "));
          return parts.join(" · ");
        }

        function renderDays() {
          el("day-tabs").innerHTML = (data.days || [])
            .map(function (day) {
              var active = day.order === dayOrder;
              return (
                '<button type="button" class="day-tab' +
                (active ? " is-active" : "") +
                '" data-day="' +
                day.order +
                '" role="tab" aria-selected="' +
                (active ? "true" : "false") +
                '">' +
                escapeHtml(day.name) +
                "</button>"
              );
            })
            .join("");
        }

        function renderPeriods() {
          el("period-tabs").innerHTML = (data.periods || [])
            .map(function (period) {
              var active = period.order === periodOrder;
              var now = data.currentPeriodOrder === period.order && data.todayDayOrder === dayOrder;
              return (
                '<button type="button" class="period-tab' +
                (active ? " is-active" : "") +
                (now ? " is-now" : "") +
                '" data-period="' +
                period.order +
                '" role="tab" aria-selected="' +
                (active ? "true" : "false") +
                '"><span>' +
                escapeHtml(period.name) +
                '</span><span class="period-time">' +
                escapeHtml(period.time || "") +
                "</span></button>"
              );
            })
            .join("");
        }

        function renderLessons() {
          var select = el("lesson-select");
          var previous = select.value;
          var lessons = lessonsForSlot();
          if (!lessons.length) {
            select.innerHTML = '<option value="">No lessons in this period</option>';
            students = [];
            el("grid-body").innerHTML = "";
            el("still-out").hidden = true;
            el("empty-state").hidden = false;
            el("empty-state").textContent = "No lessons in this period.";
            return;
          }
          select.innerHTML = lessons
            .map(function (lesson) {
              return (
                '<option value="' +
                escapeHtml(lesson.id) +
                '">' +
                escapeHtml(lessonLabel(lesson)) +
                "</option>"
              );
            })
            .join("");
          if (lessons.some(function (lesson) { return lesson.id === previous; })) {
            select.value = previous;
          }
          loadClass();
        }

        function visibleStudents() {
          var query = el("student-search").value.trim().toLowerCase();
          return students.filter(function (student) {
            if (!query) return true;
            return String(student.name || "").toLowerCase().indexOf(query) !== -1;
          });
        }

        function renderTable() {
          var empty = el("empty-state");
          var lesson = selectedLesson();
          var banner = el("still-out");
          if (!lesson) {
            el("grid-body").innerHTML = "";
            empty.hidden = false;
            empty.textContent = data && data.rosterReady === false
              ? "Class lists are loading from iSAMS. Lessons will fill in as soon as they are ready."
              : "Choose a lesson to see the class.";
            banner.hidden = true;
            return;
          }
          if (!data.rosterReady) {
            el("grid-body").innerHTML = "";
            empty.hidden = false;
            empty.textContent = data.rosterError
              ? data.rosterError
              : "Loading this class list from iSAMS…";
            banner.hidden = true;
            return;
          }
          var people = visibleStudents();
          if (!people.length) {
            el("grid-body").innerHTML = "";
            empty.hidden = false;
            empty.textContent = students.length
              ? "No students match that search."
              : "No students are listed for this lesson.";
            banner.hidden = true;
            return;
          }
          empty.hidden = true;
          var still = 0;
          people.forEach(function (student) {
            if (studentStillOut(entryFor(student.id))) still += 1;
          });
          banner.hidden = false;
          banner.classList.toggle("is-clear", still === 0);
          banner.textContent = still
            ? still + (still === 1 ? " student is still out" : " students are still out")
            : "Everyone is back in class";
          el("grid-body").innerHTML = people
            .map(function (student) {
              return studentRows(student);
            })
            .join("");
        }

        function studentRows(student) {
          var entry = entryFor(student.id);
          var trips = entry.trips.slice();
          var open = trips.some(function (trip) { return !trip.back; });
          if (!open) trips.push(blankTrip());
          var state = studentStillOut(entry) ? "is-out" : entry.trips.some(function (trip) { return trip.back; }) ? "is-back" : "";
          return trips.map(function (trip, index) {
            var saved = index < entry.trips.length;
            var closed = saved && !!trip.back;
            var reasonCell = closed ? loggedReasons(trip) : reasonControls(student.id, trip, index);
            var times = timeControls(student.id, trip, index);
            var name = index === 0
              ? '<th class="student-name" scope="row" rowspan="' + trips.length + '">' + escapeHtml(student.name) + "</th>"
              : "";
            return (
              '<tr class="' + state + (index ? " trip-more" : "") + '" data-student="' + escapeHtml(student.id) + '">' +
              name +
              "<td>" + reasonCell + "</td>" +
              times +
              "</tr>"
            );
          }).join("");
        }

        function loggedReasons(trip) {
          var reasons = tripReasons(trip);
          if (trip.other) reasons = reasons.map(function (reason) {
            return reason === "Other" ? "Other: " + trip.other : reason;
          });
          if (!reasons.length) return '<span class="meta">No reason</span>';
          return (
            '<div class="reason-list">' +
            reasons.map(function (reason) {
              return '<span class="reason-chip is-logged">' + escapeHtml(reason) + "</span>";
            }).join("") +
            "</div>"
          );
        }

        function reasonControls(studentId, trip, index) {
          var chosen = tripReasons(trip);
          var chips = REASONS.map(function (reason) {
            var active = chosen.indexOf(reason) !== -1;
            return (
              '<button type="button" class="reason-chip' +
              (active ? " is-active" : "") +
              '" data-student="' + escapeHtml(studentId) +
              '" data-trip="' + index +
              '" data-reason="' + escapeHtml(reason) +
              '" aria-pressed="' + (active ? "true" : "false") +
              '">' + escapeHtml(reason) + "</button>"
            );
          }).join("");
          var other = chosen.indexOf("Other") !== -1
            ? '<input class="other-input" data-student="' + escapeHtml(studentId) +
              '" data-trip="' + index +
              '" data-field="other" placeholder="Something else" value="' +
              escapeHtml(trip.other || "") + '" />'
            : "";
          return '<div class="reason-list">' + chips + other + "</div>";
        }

        function timeControls(studentId, trip, index) {
          var attrs = ' data-student="' + escapeHtml(studentId) + '" data-trip="' + index + '"';
          return (
            '<td class="time-cell"><input class="time-input" type="time"' + attrs +
            ' data-field="left" value="' + escapeHtml(trip.left || "") +
            '" aria-label="Time left" /> <button type="button" class="mini-btn"' + attrs +
            ' data-stamp="left">Now</button></td><td class="time-cell"><input class="time-input" type="time"' + attrs +
            ' data-field="back" value="' + escapeHtml(trip.back || "") +
            '" aria-label="Time back" /> <button type="button" class="mini-btn back"' + attrs +
            ' data-stamp="back">Back</button> <button type="button" class="mini-btn"' + attrs +
            ' data-clear="1">Clear</button></td>'
          );
        }

        function loadClass() {
          var lesson = selectedLesson();
          classToken += 1;
          var token = classToken;
          if (!lesson) {
            students = [];
            renderTable();
            return;
          }
          if (!data.rosterReady) {
            students = [];
            renderTable();
            return;
          }
          var url = "/api/lesson-out/class?setId=" + encodeURIComponent(lesson.setId || "") +
            "&code=" + encodeURIComponent(lesson.code || "");
          fetch(url, { credentials: "same-origin" })
            .then(function (response) { return response.json(); })
            .then(function (body) {
              if (token !== classToken) return;
              if (!body || body.ok === false) throw new Error((body && body.error) || "Could not load the class");
              if (!body.ready) {
                data.rosterReady = false;
                students = [];
                renderTable();
                return;
              }
              students = body.students || [];
              renderTable();
            })
            .catch(function (err) {
              if (token !== classToken) return;
              setErr(err && err.message ? err.message : String(err));
            });
        }

        function scheduleRosterPoll() {
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(function () {
            if (!data || data.rosterReady) {
              clearInterval(pollTimer);
              pollTimer = null;
              return;
            }
            refreshIndex(false);
          }, 3000);
        }

        function applyIndex(payload) {
          var hadLesson = el("lesson-select").value;
          data = payload;
          if (!dayOrder) dayOrder = data.todayDayOrder || (data.days[0] && data.days[0].order) || 1;
          if (data.todayDayOrder && !el("day-tabs").children.length) dayOrder = data.todayDayOrder;
          if (data.currentPeriodOrder && !el("period-tabs").children.length) periodOrder = data.currentPeriodOrder;
          var meta = "Saved in this browser for now. A Google Sheet or Supabase table can store this later.";
          if (!data.rosterReady) {
            meta = data.rosterError || "Loading class lists from iSAMS… " + meta;
          }
          el("generated-meta").textContent = meta;
          renderDays();
          renderPeriods();
          renderLessons();
          if (hadLesson) {
            var exists = lessonsForSlot().some(function (lesson) { return lesson.id === hadLesson; });
            if (exists) el("lesson-select").value = hadLesson;
          }
          if (!data.rosterReady) scheduleRosterPoll();
          else if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
          }
        }

        function refreshIndex(forceStaff) {
          setErr("");
          var btn = el("refresh-btn");
          if (forceStaff) {
            btn.disabled = true;
            btn.textContent = "Refreshing…";
          }
          var staff = forceStaff
            ? fetch("/api/teaching-staff-timetable?refresh=1", { credentials: "same-origin" }).then(function (r) { return r.json(); })
            : Promise.resolve(null);
          return staff
            .then(function () {
              return fetch("/api/lesson-out" + (forceStaff ? "?rebuild=1" : ""), { credentials: "same-origin" });
            })
            .then(function (response) {
              return response.json().then(function (body) {
                if (!response.ok || !body || body.ok === false) {
                  throw new Error((body && body.error) || "Could not load the timetable");
                }
                return body;
              });
            })
            .then(applyIndex)
            .catch(function (err) {
              setErr(err && err.message ? err.message : String(err));
            })
            .then(function () {
              btn.disabled = false;
              btn.textContent = "Refresh from iSAMS";
            });
        }

        el("day-tabs").addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-day]");
          if (!btn || !data) return;
          dayOrder = Number(btn.getAttribute("data-day"));
          renderDays();
          renderPeriods();
          renderLessons();
        });
        el("period-tabs").addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-period]");
          if (!btn || !data) return;
          periodOrder = Number(btn.getAttribute("data-period"));
          renderPeriods();
          renderLessons();
        });
        el("lesson-select").addEventListener("change", loadClass);
        el("student-search").addEventListener("input", function () {
          if (students.length) renderTable();
        });
        el("refresh-btn").addEventListener("click", function () {
          refreshIndex(true);
        });
        el("grid-body").addEventListener("click", function (ev) {
          var reasonBtn = ev.target.closest("[data-reason]");
          var stampBtn = ev.target.closest("[data-stamp]");
          var clearBtn = ev.target.closest("[data-clear]");
          if (reasonBtn) {
            var id = reasonBtn.getAttribute("data-student");
            var tripIndex = Number(reasonBtn.getAttribute("data-trip"));
            var reason = reasonBtn.getAttribute("data-reason");
            var entry = entryFor(id);
            var trip = ensureTrip(entry, tripIndex);
            var at = trip.reasons.indexOf(reason);
            if (at === -1) trip.reasons.push(reason);
            else {
              trip.reasons.splice(at, 1);
              if (reason === "Other") trip.other = "";
            }
            if (!trip.reasons.length) trip.other = "";
            if (trip.reasons.length && !trip.left) trip.left = nowTime();
            if (!trip.reasons.length && !trip.back) trip.left = "";
            saveStudent(id, entry);
            renderTable();
            if (reason === "Other" && trip.reasons.indexOf("Other") !== -1) {
              var input = el("grid-body").querySelector(
                '[data-field="other"][data-student="' + id + '"][data-trip="' + tripIndex + '"]'
              );
              if (input) input.focus();
            }
            return;
          }
          if (stampBtn) {
            var sid = stampBtn.getAttribute("data-student");
            var field = stampBtn.getAttribute("data-stamp");
            var stamped = entryFor(sid);
            var current = ensureTrip(stamped, Number(stampBtn.getAttribute("data-trip")));
            current[field] = nowTime();
            if (field === "back" && !current.left) current.left = current.back;
            saveStudent(sid, stamped);
            renderTable();
            return;
          }
          if (clearBtn) {
            var clearedId = clearBtn.getAttribute("data-student");
            var cleared = entryFor(clearedId);
            cleared.trips.splice(Number(clearBtn.getAttribute("data-trip")), 1);
            saveStudent(clearedId, cleared);
            renderTable();
          }
        });
        el("grid-body").addEventListener("change", function (ev) {
          var input = ev.target.closest("[data-field]");
          if (!input || input.getAttribute("data-field") === "other") return;
          var id = input.getAttribute("data-student");
          var entry = entryFor(id);
          var trip = ensureTrip(entry, Number(input.getAttribute("data-trip")));
          trip[input.getAttribute("data-field")] = input.value;
          saveStudent(id, entry);
          renderTable();
        });
        el("grid-body").addEventListener("input", function (ev) {
          var input = ev.target.closest('[data-field="other"]');
          if (!input) return;
          var id = input.getAttribute("data-student");
          var entry = entryFor(id);
          var trip = ensureTrip(entry, Number(input.getAttribute("data-trip")));
          trip.other = input.value;
          if (trip.reasons.indexOf("Other") === -1) trip.reasons.push("Other");
          if (!trip.left) trip.left = nowTime();
          saveStudent(id, entry);
        });

        if (data && data.todayDayOrder) dayOrder = data.todayDayOrder;
        refreshIndex(false);
      })();
    </script>
  </body>
</html>
